<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Centered divider: thin rules with a heather sprig and a tiny four-leaf clover -->
  <symbol id="sprig" viewBox="0 0 200 40">
    <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22 H70" />
      <path d="M130 22 H196" />
      <!-- stem -->
      <path d="M78 26 C 90 22, 104 20, 122 14" />
      <!-- leaves -->
      <path d="M88 23.5 C 86 17, 90 14, 94 13 C 94 18, 92 21, 88 23.5 Z" />
      <path d="M96 21.5 C 99 27, 104 28.5, 108 28 C 106 24, 101 21.5, 96 21.5 Z" />
      <path d="M104 19.5 C 103 13, 107 10, 111 9.5 C 110.5 14, 108.5 17.5, 104 19.5 Z" />
      <path d="M112 17.5 C 115 22, 119 23, 123 22 C 121 18.5, 117 17, 112 17.5 Z" />
    </g>
    <!-- heather buds -->
    <g fill="currentColor">
      <circle cx="122" cy="14" r="1.6" />
      <circle cx="125" cy="12" r="1.3" />
      <circle cx="127.5" cy="10.5" r="1" />
      <circle cx="80" cy="25.5" r="1.2" />
    </g>
    <!-- tiny clover above the sprig -->
    <g transform="translate(100 8) scale(.4) translate(-20 -18)">
      <use href="#clover-leaves" />
    </g>
  </symbol>

  <!-- Last day of winter, first of spring: snow drifts in on the left, leaves sprout on the right,
       with a snowflake and a blossom on either side of a tiny clover -->
  <g id="sf-arm" fill="none" stroke-width=".9" stroke-linecap="round">
    <path d="M0 -1.6V-8.5M0 -4.6L-2 -6.4M0 -4.6L2 -6.4M0 -6.9L-1.2 -8M0 -6.9L1.2 -8" />
  </g>
  <path id="sf-petal" fill="none" stroke-width=".9" stroke-linejoin="round"
    d="M0 -1.4C-2.7 -3.1 -3 -6.6 -1.1 -7.8L0 -6.8L1.1 -7.8C3 -6.6 2.7 -3.1 0 -1.4Z" />
  <path id="sf-leaf" fill="none" stroke-width=".8" stroke-linejoin="round" d="M0 0C1 -2.2 3 -3 5 -2.6C4.2 -.8 2.4 .2 0 0Z" />
  <symbol id="spring" viewBox="0 0 200 40">
    <g stroke="currentColor">
      <path d="M4 20H58M86 20H92M108 20H114M142 20H196" fill="none" stroke-width="1" stroke-linecap="round" />
      <!-- snowflake -->
      <g transform="translate(72 20)">
        <use href="#sf-arm" /><use href="#sf-arm" transform="rotate(60)" /><use href="#sf-arm" transform="rotate(120)" />
        <use href="#sf-arm" transform="rotate(180)" /><use href="#sf-arm" transform="rotate(240)" /><use href="#sf-arm" transform="rotate(300)" />
        <circle r="1.2" fill="none" stroke-width=".8" />
      </g>
      <!-- blossom -->
      <g transform="translate(128 20)">
        <use href="#sf-petal" /><use href="#sf-petal" transform="rotate(72)" /><use href="#sf-petal" transform="rotate(144)" />
        <use href="#sf-petal" transform="rotate(216)" /><use href="#sf-petal" transform="rotate(288)" />
      </g>
      <!-- tiny clover in the middle -->
      <g fill="none" stroke-width="2.6" stroke-linejoin="round" transform="translate(100 20) scale(.32) translate(-20 -18)">
        <use href="#clover-leaf" /><use href="#clover-leaf" transform="rotate(90 20 18)" />
        <use href="#clover-leaf" transform="rotate(180 20 18)" /><use href="#clover-leaf" transform="rotate(270 20 18)" />
      </g>
      <!-- sprouting leaves -->
      <use href="#sf-leaf" transform="translate(150 20) rotate(-25)" />
      <use href="#sf-leaf" transform="translate(166 20) rotate(205) scale(.85)" />
    </g>
    <g fill="currentColor">
      <circle cx="128" cy="20" r="1.1" />
      <!-- drifting snow -->
      <circle cx="46" cy="14" r=".8" /><circle cx="36" cy="25" r=".6" /><circle cx="24" cy="15" r=".5" />
    </g>
  </symbol>

  <!-- Crossed skis with poles -->
  <symbol id="skis" viewBox="0 0 200 40">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20H74M126 20H196" stroke-width="1" />
      <!-- poles, grips and baskets -->
      <path d="M93 38L106.5 3M107 38L93.5 3" stroke-width=".9" />
      <path d="M105.4 5.5L107.6 1.2M94.6 5.5L92.4 1.2" stroke-width="2.2" />
      <circle cx="94.2" cy="34.8" r="2.3" stroke-width=".8" />
      <circle cx="105.8" cy="34.8" r="2.3" stroke-width=".8" />
      <!-- skis with upturned tips -->
      <path d="M80 37L116 9.5Q120.5 6 119 3" stroke-width="2.6" />
      <path d="M120 37L84 9.5Q79.5 6 81 3" stroke-width="2.6" />
    </g>
    <!-- bindings -->
    <g fill="currentColor">
      <rect x="-2.6" y="-1.4" width="5.2" height="2.8" rx=".6" transform="translate(91 28.6) rotate(-37)" />
      <rect x="-2.6" y="-1.4" width="5.2" height="2.8" rx=".6" transform="translate(109 28.6) rotate(37)" />
    </g>
  </symbol>

  <!-- One heart-shaped leaf pointing up from the center (20,18), repeated four times -->
  <g id="clover-leaves" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <path id="clover-leaf" d="M20 18 C 16.5 14.5, 13 10.5, 15.6 7.6 C 17.4 5.6, 19.6 6.6, 20 8.6 C 20.4 6.6, 22.6 5.6, 24.4 7.6 C 27 10.5, 23.5 14.5, 20 18 Z" />
    <use href="#clover-leaf" transform="rotate(90 20 18)" />
    <use href="#clover-leaf" transform="rotate(180 20 18)" />
    <use href="#clover-leaf" transform="rotate(270 20 18)" />
  </g>

  <!-- Curly four-leaf clover: thin line, used in the footer and the family link -->
  <symbol id="clover" viewBox="0 0 40 40">
    <use href="#clover-leaves" transform="translate(0 -2) rotate(20 20 18)" />
    <path fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"
      d="M21.5 18.5 C 23 23, 26.5 25, 25 29.5 C 24 32.5, 20.5 32.5, 21 30 C 21.4 28.2, 23.6 28.6, 23.4 30.2" />
  </symbol>

</svg>
